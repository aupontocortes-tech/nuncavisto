name: Publicar Shorts no YouTube

on:
  push:
    branches: [main]
    paths: ['publicar/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-auth-oauthlib google-api-python-client
      - name: Enviar cada vídeo da pasta publicar/
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          shopt -s nullglob
          enviados=0
          for meta in publicar/*.json; do
            video="${meta%.json}.mp4"
            if [ -f "$video" ]; then
              echo "Enviando $video"
              python3 yt.py up "$video" "$meta"
              # registra no histórico completo (o agente consulta para não repetir assunto)
              python3 -c "import json,sys,datetime;t=json.load(open(sys.argv[1]))['title'].replace(' #Shorts','');L=open('HISTORICO.md').read().split('\n');L.insert(4,'- '+datetime.date.today().isoformat()+' | '+t);open('HISTORICO.md','w').write('\n'.join(L))" "$meta" || true
              git add HISTORICO.md
              git rm -q "$video" "$meta"
              [ -f "${meta%.json}.jpg" ] && git rm -q "${meta%.json}.jpg"
              enviados=$((enviados+1))
            fi
          done
          if [ "$enviados" -gt 0 ]; then
            git config user.name "publicador-nv"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Publicados $enviados video(s) no YouTube"
            git push
          fi
