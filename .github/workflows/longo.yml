name: Nunca Visto - publicar video longo
# Disparado pelo botão "Vídeos longos" do app. O vídeo já está pronto em longos/videos/ (mp4 + capa + descrição).
on:
  workflow_dispatch:
    inputs:
      arquivo:
        description: 'roteiro em longos/fila (ex.: longos/fila/02_animais_400_anos.json)'
        required: true
concurrency: nv-longo
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q google-auth-oauthlib google-api-python-client
      - name: Publicar
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          set -o pipefail
          A="${{ github.event.inputs.arquivo }}"
          case "$A" in longos/fila/*.json) ;; *) echo "::error::arquivo inválido"; exit 1;; esac
          N=$(basename "$A" .json); V="longos/videos/$N"
          [ -f "$V.mp4" ] || { echo "::error::vídeo $V.mp4 não encontrado"; exit 1; }
          python3 yt.py up "$V.mp4" "$V.json" | tee up.log
          ID=$(head -1 up.log | cut -d' ' -f1)
          python3 -c "import json,sys; p=sys.argv[1]; d=json.load(open(p)); d['video_id']=sys.argv[2]; d['estado']='publicado'; json.dump(d,open(p,'w'),ensure_ascii=False,indent=1)" "$A" "$ID"
          T=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['title'])" "$V.json")
          python3 -c "import sys,datetime;L=open('HISTORICO.md').read().split('\n');L.insert(4,'- '+datetime.date.today().isoformat()+' | '+sys.argv[1]+' (vídeo longo https://youtu.be/'+sys.argv[2]+')');open('HISTORICO.md','w').write('\n'.join(L))" "$T" "$ID" || true
          mkdir -p longos/publicados && git mv -f "$A" longos/publicados/
          git rm -q "$V.mp4" "$V.jpg" "$V.json"
          git add -A longos HISTORICO.md
          git config user.name "publicador-nv" && git config user.email "actions@users.noreply.github.com"
          git commit -qm "Vídeo longo publicado: $N ($ID)" && git pull -q --rebase && git push -q
